name: deploy-hf-space

# Mirrors the app into a Hugging Face Space.
#
# NOTE: Hugging Face requires a PRO subscription ($9/month) to host compute
# Spaces (Streamlit/Gradio/Docker) on cpu-basic - free accounts only get static
# Spaces, which cannot run a Python server. Automatic deployment therefore stays
# switched off unless you set the repository variable HF_DEPLOY_ENABLED=true.
#
# Configure it once in the repository settings:
#   - Secret    HF_TOKEN            = a Hugging Face token with "write" scope
#   - Variable  HF_SPACE_ID         = e.g. ruksanakhanum/superkart-sales-prediction
#   - Variable  HF_DEPLOY_ENABLED   = true (only with a PRO subscription)
# Manual runs from the Actions tab always work, regardless of the variable.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.HF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::notice::HF_TOKEN and/or HF_SPACE_ID are not configured - skipping Hugging Face deployment."
            exit 0
          fi
          pip install "huggingface_hub>=0.34"
          python deploy_hf.py --space-id "$HF_SPACE_ID"
